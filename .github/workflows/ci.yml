name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade 'pip>=26.2.1'
          python -m pip install -e '.[dev,security]'
      - name: Lint and test
        run: make check
      - name: Security scans
        if: matrix.python-version == '3.12'
        run: make security
      - name: Build distributions
        run: python -m build
      - name: Smoke test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -m flask --app cvt_dashboard:create_app init-db
          python -m flask --app cvt_dashboard:create_app build-collector
          python - <<'PY'
          import re
          from cvt_dashboard import create_app
          from cvt_dashboard.database import get_connection

          app = create_app()
          client = app.test_client()
          response = client.get("/")
          assert response.status_code == 200
          token = re.search(r'name="csrf_token" value="([^"]+)"', response.text).group(1)
          response = client.post("/import", data={"csrf_token": token}, follow_redirects=True)
          assert response.status_code == 200
          assert b"Snapshot collection failed" not in response.data
          with app.app_context():
              assert get_connection().execute("SELECT COUNT(*) FROM cvt").fetchone()[0] == 1
          PY
